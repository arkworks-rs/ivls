name: CI
on:
  pull_request:
  push:
    branches:
      - master
env:
  RUST_BACKTRACE: 1
  # Frozen 2021 crates warn heavily on modern rustc; do not use -Dwarnings.
  RUSTFLAGS: --cap-lints=allow

jobs:
  style:
    name: Check Style
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: cargo fmt --check
      run: cargo fmt --all -- --check

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock', 'third_party/REVS.txt') }}

      - name: Cache third_party
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ hashFiles('third_party/REVS.txt', 'scripts/apply-compat-patches.sh') }}

      - name: Fetch frozen arkworks deps
        run: ./scripts/fetch-third-party.sh

      - name: Check library
        run: cargo check --lib --all-features

      - name: Unit and fast integration tests
        # Full Marlin / MNT-753 PCD tests are multi-hour; keep CI to the archival smoke set.
        run: |
          cargo test --lib
          cargo test --test merkle_sparse_tree --test state
          cargo test --test verifiable_transition_mnt_small_groth16

  check_no_std:
    name: Check no_std
    runs-on: ubuntu-latest
    # Global RUSTFLAGS=--cap-lints=allow breaks cargo's aarch64-unknown-none target probe.
    # Compat patches already soften crate-level denies; host RUSTFLAGS is not needed here.
    env:
      RUSTFLAGS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nostd-${{ hashFiles('**/Cargo.lock', 'third_party/REVS.txt') }}

      - name: Cache third_party
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ hashFiles('third_party/REVS.txt', 'scripts/apply-compat-patches.sh') }}

      - name: Fetch frozen arkworks deps
        run: ./scripts/fetch-third-party.sh

      - name: Check no_std
        run: cargo check --lib --no-default-features --target aarch64-unknown-none
